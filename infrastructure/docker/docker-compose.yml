# Local dev/demo stack for the bus-ticketing platform's backend services.
#
# NOTE: not run/verified in the environment that generated this repo (no
# Docker/network access there). Reviewed by hand for correctness; run
# `docker compose config` locally before relying on it.

name: bus-ticketing

services:
  postgres:
    image: postgres:16-alpine
    container_name: bus-ticketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: booking_service
      POSTGRES_USER: booking_svc
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_svc -d booking_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bus-ticketing-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: bus-ticketing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-service:
    build:
      context: ../../services/booking-service
      dockerfile: src/BookingService.Api/Dockerfile
    container_name: bus-ticketing-booking-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookingDb: "Host=postgres;Port=5432;Database=booking_service;Username=booking_svc;Password=changeme"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      Jwt__Issuer: "https://identity.bus-ticketing.local"
      Jwt__Audience: "bus-ticketing-api"
      Jwt__SigningKey: "dev-only-signing-key-change-me-32chars-minimum"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://localhost:5173"
    ports:
      - "8080:8080"

  customer-web:
    build:
      context: ../../apps/angular-client/bus-ticketing-customer-web
      dockerfile: Dockerfile
    container_name: bus-ticketing-customer-web
    restart: unless-stopped
    depends_on:
      - booking-service
      - auth-service
      - payment-service
    ports:
      - "4200:80"

  admin-console:
    build:
      context: ../../apps/react-admin/bus-ticketing-admin
      dockerfile: Dockerfile
    container_name: bus-ticketing-admin-console
    restart: unless-stopped
    depends_on:
      - booking-service
      - auth-service
      - bus-service
      - route-service
    ports:
      - "5173:80"

  # --- Notification Service ---
  # Added alongside the existing services above without modifying any of
  # them. Uses its own Postgres container (postgres-notification) rather
  # than adding a second database to the shared `postgres` container above
  # — the official postgres image has no built-in multi-database
  # provisioning without a custom init script, and a second container is
  # zero-risk to the already-working booking-service setup. Same
  # "not run/verified, reviewed by hand" caveat as the rest of this file —
  # see the top-of-file note — applies to everything below.
  postgres-notification:
    image: postgres:16-alpine
    container_name: bus-ticketing-postgres-notification
    restart: unless-stopped
    environment:
      POSTGRES_DB: notification_service
      POSTGRES_USER: notification_svc
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_svc -d notification_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP catcher for local dev — every email Notification Service sends
  # lands here instead of a real inbox. Web UI at http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bus-ticketing-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: src/NotificationService.Api/Dockerfile
    container_name: bus-ticketing-notification-service
    restart: unless-stopped
    depends_on:
      postgres-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: "Host=postgres-notification;Port=5432;Database=notification_service;Username=notification_svc;Password=changeme"
      Database__Provider: "Postgres"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      Smtp__UseStartTls: "false"
      Jwt__Issuer: "https://identity.bus-ticketing.local"
      Jwt__Audience: "bus-ticketing-api"
      Jwt__SigningKey: "dev-only-signing-key-change-me-32chars-minimum"
    ports:
      - "8081:8080"

  # --- Bus Service ---
  postgres-bus:
    image: postgres:16-alpine
    container_name: bus-ticketing-postgres-bus
    restart: unless-stopped
    environment:
      POSTGRES_DB: bus_service
      POSTGRES_USER: bus_svc
      POSTGRES_PASSWORD: changeme
    ports:
      - "5434:5432"
    volumes:
      - postgres-bus-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bus_svc -d bus_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  bus-service:
    build:
      context: ../../services/bus-service
      dockerfile: src/BusService.Api/Dockerfile
    container_name: bus-ticketing-bus-service
    restart: unless-stopped
    depends_on:
      postgres-bus:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BusDb: "Host=postgres-bus;Port=5432;Database=bus_service;Username=bus_svc;Password=changeme"
      Database__Provider: "Postgres"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      Redis__ConnectionString: "redis:6379"
      Jwt__Issuer: "https://identity.bus-ticketing.local"
      Jwt__Audience: "bus-ticketing-api"
      Jwt__SigningKey: "dev-only-signing-key-change-me-32chars-minimum"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://localhost:5173"
    ports:
      - "5201:8080"

  # --- Payment Service ---
  postgres-payment:
    image: postgres:16-alpine
    container_name: bus-ticketing-postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_service
      POSTGRES_USER: payment_svc
      POSTGRES_PASSWORD: changeme
    ports:
      - "5435:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_svc -d payment_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/src/PaymentService.Api/Dockerfile
    container_name: bus-ticketing-payment-service
    restart: unless-stopped
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres-payment;Port=5432;Database=payment_service;Username=payment_svc;Password=changeme"
      Database__Provider: "Postgres"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      Redis__ConnectionString: "redis:6379"
      Jwt__Issuer: "https://identity.bus-ticketing.local"
      Jwt__Audience: "bus-ticketing-api"
      Jwt__SigningKey: "dev-only-signing-key-change-me-32chars-minimum"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://localhost:5173"
    ports:
      - "5202:8080"

  # --- Auth Service ---
  # Issues/validates the JWTs every other service here trusts (same
  # Jwt__SigningKey/Issuer/Audience as booking/bus/payment/notification
  # above) — without this container running, nothing in the stack can
  # actually obtain a token.
  postgres-auth:
    image: postgres:16-alpine
    container_name: bus-ticketing-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: auth_svc
      POSTGRES_PASSWORD: changeme
    ports:
      - "5436:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_svc -d auth_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/src/AuthService.Api/Dockerfile
    container_name: bus-ticketing-auth-service
    restart: unless-stopped
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AuthDb: "Host=postgres-auth;Port=5432;Database=auth_service;Username=auth_svc;Password=changeme"
      Database__Provider: "Postgres"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      Jwt__Issuer: "https://identity.bus-ticketing.local"
      Jwt__Audience: "bus-ticketing-api"
      Jwt__SigningKey: "dev-only-signing-key-change-me-32chars-minimum"
      # Dev-only guaranteed Admin login -- see DevAdminBootstrapper.cs.
      # Disabled by default even here; flip to "true" for a local/dev stack
      # that needs a working admin account out of the box. Never set this
      # to true in a production compose file/environment.
      BOOTSTRAP_ADMIN_ENABLED: "false"
      BOOTSTRAP_ADMIN_EMAIL: "admin@bus.local"
      BOOTSTRAP_ADMIN_PASSWORD: "Admin@12345!"
    ports:
      - "5203:8080"

  # --- Route Service ---
  postgres-route:
    image: postgres:16-alpine
    container_name: bus-ticketing-postgres-route
    restart: unless-stopped
    environment:
      POSTGRES_DB: route_service
      POSTGRES_USER: route_svc
      POSTGRES_PASSWORD: changeme
    ports:
      - "5437:5432"
    volumes:
      - postgres-route-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U route_svc -d route_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  route-service:
    build:
      context: ../..
      dockerfile: services/route-service/src/RouteService.Api/Dockerfile
    container_name: bus-ticketing-route-service
    restart: unless-stopped
    depends_on:
      postgres-route:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RouteDb: "Host=postgres-route;Port=5432;Database=route_service;Username=route_svc;Password=changeme"
      Database__Provider: "Postgres"
      Redis__ConnectionString: "redis:6379"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      Jwt__Issuer: "https://identity.bus-ticketing.local"
      Jwt__Audience: "bus-ticketing-api"
      Jwt__SigningKey: "dev-only-signing-key-change-me-32chars-minimum"
    ports:
      - "5204:8080"

volumes:
  postgres-data:
  postgres-notification-data:
  postgres-bus-data:
  postgres-payment-data:
  postgres-auth-data:
  postgres-route-data:
