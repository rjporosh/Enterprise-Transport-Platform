syntax = "proto3";

option csharp_namespace = "NotificationService.Api.Grpc";

package notification;

// Internal, service-to-service surface. REST (Endpoints/) is for the admin
// console and external callers; gRPC is for Booking/Payment/Auth Service to
// trigger a notification synchronously (send-accepted ack, low overhead)
// as an alternative to the async RabbitMQ event path (NotificationEventConsumer)
// -- useful when a caller needs to know the send was *accepted* before it
// proceeds, e.g. blocking a booking-confirmation screen on "receipt email
// queued" without waiting for actual SMTP delivery.
service NotificationGrpcService {
  rpc SendNotification (SendNotificationRequest) returns (SendNotificationReply);
  rpc GetNotificationStatus (GetNotificationStatusRequest) returns (GetNotificationStatusReply);
}

enum GrpcChannel {
  GRPC_CHANNEL_UNSPECIFIED = 0;
  GRPC_CHANNEL_EMAIL = 1;
  GRPC_CHANNEL_SMS = 2;
  GRPC_CHANNEL_PUSH = 3;
}

message SendNotificationRequest {
  string recipient = 1;
  GrpcChannel channel = 2;
  string template_key = 3;               // required: gRPC callers always send via a template, never raw body
  map<string, string> template_variables = 4;
  string recipient_id = 5;               // optional external user id (opt-out / locale lookup)
  string source_reference = 6;           // e.g. BookingId, PaymentId -- for audit/support lookups
  string locale = 7;                     // optional; "" = default (en)
  bool is_transactional = 8;             // true bypasses recipient opt-out (see RecipientPreference)
}

message SendNotificationReply {
  string notification_id = 1;
  string status = 2;
}

message GetNotificationStatusRequest {
  string notification_id = 1;
}

message GetNotificationStatusReply {
  string notification_id = 1;
  string status = 2;
  string last_error = 3;
}
