server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Real backend services, routed by path prefix (most specific first) —
    # no API Gateway exists yet (infrastructure/gateway/ is an empty
    # placeholder), so nginx does this routing directly for the production
    # build, mirroring proxy.conf.json used by `ng serve` in development.
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8080/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/payments/ {
        proxy_pass http://payment-service:8080/api/v1/payments/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Trips and bookings both live in booking-service.
    location /api/v1/ {
        proxy_pass http://booking-service:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular's app.routes.ts drives client-side routing; unknown paths must
    # fall back to index.html rather than 404ing on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
