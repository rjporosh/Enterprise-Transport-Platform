server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular's app.routes.ts drives client-side routing; unknown paths must
    # fall back to index.html rather than 404ing on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
