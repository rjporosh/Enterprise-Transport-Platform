server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # M0: every API call goes to the ONE platform API gateway. nginx no longer
    # knows about individual services — the gateway (YARP) owns routing.
    # The gateway's Docker DNS name + port is overridable via the GATEWAY_UPSTREAM
    # build/run arg; default matches infrastructure/docker/docker-compose.yml.
    location /api/v1/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve a client-supplied correlation id; the gateway validates/generates it.
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_read_timeout 60s;
    }

    # Angular's app.routes.ts drives client-side routing; unknown paths must
    # fall back to index.html rather than 404ing on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
