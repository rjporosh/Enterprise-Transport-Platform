server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Real backend services, routed by path prefix (most specific first) —
    # no API Gateway exists yet (infrastructure/gateway/ is an empty
    # placeholder), so nginx does this routing directly for the production
    # build, mirroring vite.config.ts's dev-server proxy.
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8080/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/admin/ {
        proxy_pass http://auth-service:8080/api/v1/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/buses/ {
        proxy_pass http://bus-service:8080/api/v1/buses/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/routes/ {
        proxy_pass http://route-service:8080/api/v1/routes/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/stops/ {
        proxy_pass http://route-service:8080/api/v1/stops/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # bookings/{id} (get) and bookings/{id}/cancel live in booking-service.
    # Plain GET /api/v1/bookings (list) and /api/v1/trips (list) have no
    # real backend endpoint yet — see src/api/mockAdapter.ts — so those two
    # stay served by the app's own in-process mock fallback rather than
    # reaching nginx at all (mockApi's real-mode fallback handles them
    # before axios ever sends the request).
    location /api/v1/ {
        proxy_pass http://booking-service:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
